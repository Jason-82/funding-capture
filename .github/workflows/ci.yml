name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # Git Bash on Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  # The Windows runbook (docs/RUNBOOK_US.md) step by step in Git Bash, against live
  # public market data. No API keys: nothing here can place an order.
  windows-runbook:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (runbook steps 2-3)
        run: |
          py -0p || true
          py -3.12 -m venv .venv
          source .venv/Scripts/activate
          which python fcap || true
          pip install -e ".[dev]"
          pytest -q
      - name: Config and check (runbook steps 4-5)
        run: |
          source .venv/Scripts/activate
          cp config.us.yaml config.yaml
          mkdir -p logs
          fcap -c config.yaml check
      - name: Markets and scan (runbook step 6)
        run: |
          source .venv/Scripts/activate
          fcap -c config.yaml markets --venue coinbase --kind perp > logs/markets.txt
          head -40 logs/markets.txt
          wc -l logs/markets.txt
          fcap -c config.yaml markets --venue kraken --kind spot > logs/kraken.txt
          wc -l logs/kraken.txt
          fcap -c config.yaml scan --top 30
          fcap -c config.yaml scan --all --top 30
      - name: Record and paper (runbook step 7)
        run: |
          source .venv/Scripts/activate
          fcap -c config.yaml --log-file logs/record.log record --once
          ls -R data | head -40
          fcap -c config.yaml --log-file logs/paper.log paper --steps 2
          fcap -c config.yaml status
      - name: QUIT file ends a running engine (runbook "Stopping")
        run: |
          source .venv/Scripts/activate
          fcap -c config.yaml --log-file logs/paper.log paper &
          pid=$!
          sleep 45
          touch state/paper/QUIT
          for i in $(seq 1 30); do kill -0 $pid 2>/dev/null || break; sleep 2; done
          if kill -0 $pid 2>/dev/null; then echo "engine did not exit"; kill $pid; exit 1; fi
          wait $pid
          test ! -e state/paper/QUIT
          grep "QUIT file found" logs/paper.log
      - name: Keys command in Git Bash (fake keys, separate env file)
        run: |
          source .venv/Scripts/activate
          printf 'fake-key\nfake-secret\n' | fcap --env-file logs/test.env keys kraken
          grep -c '^KRAKEN_' logs/test.env
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runbook-logs
          path: logs/

  # Temporary: raw Coinbase public data, to check the adapter's parsing against reality.
  coinbase-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Probe
        shell: python
        run: |
          import json
          import ccxt
          from funding_capture.cli import _data_venues
          from funding_capture.config import load_settings

          ex = ccxt.coinbase()
          ex.load_markets()
          swaps = [m["symbol"] for m in ex.markets.values() if m.get("swap")]
          print("ccxt swaps:", len(swaps), swaps[:5])
          tk = ex.fetch_tickers(["BTC/USD", "DOGE/USD"])
          for s, t in tk.items():
              print("ticker", s, {k: t.get(k) for k in ("bid", "ask", "last", "bidVolume", "quoteVolume", "baseVolume")})
              print("  info keys:", sorted(t["info"])[:60])
          ob = ex.fetch_order_book("BTC/USD", 5)
          print("ccxt book BTC/USD", ob["bids"][:3], ob["asks"][:3])
          raw = ex.v3PublicGetBrokerageMarketProductBook({"product_id": "BTC-USD", "limit": 3})
          print("raw book", json.dumps(raw)[:1500])
          prods = ex.v3PublicGetBrokerageMarketProducts({"product_type": "FUTURE"})["products"]
          perps = [p for p in prods if (p.get("future_product_details") or {}).get("funding_interval")]
          print(len(prods), "future products;", len(perps), "with funding_interval")
          bip = next(p for p in perps if p["product_id"].startswith("BIP"))
          print(json.dumps(bip, indent=1))
          for p in perps:
              f = p["future_product_details"]
              print(p["product_id"], f.get("contract_display_name"), f.get("contract_size"),
                    "rate", f.get("funding_rate"), "time", f.get("funding_time"),
                    "bid", p.get("best_bid_price"), "ask", p.get("best_ask_price"),
                    "vol", p.get("approximate_quote_24h_volume"), "disabled", p.get("trading_disabled"),
                    "non_crypto", f.get("non_crypto"))

          v = _data_venues(load_settings("config.us.yaml"))["coinbase"]
          insts = v.load_instruments()
          perps_i = [i for i in insts if i.is_perp]
          spots_i = [i for i in insts if not i.is_perp]
          print("venue:", len(perps_i), "perps,", len(spots_i), "spots")
          fs = v.fetch_funding(perps_i[:3])
          print("funding", {k: (s.rate, s.next_funding_ts, s.mark_price) for k, s in fs.items()})
          sample = perps_i[:2] + [i for i in spots_i if i.asset in ("BTC", "DOGE")]
          for k, q in v.fetch_quotes(sample).items():
              print("quote", k, q.bid, q.ask, q.bid_size, q.ask_size, q.volume_usd_24h)
          for i in sample:
              t = v.fetch_touch(i)
              print("touch", i.key, t.bid, t.ask, t.bid_size, t.ask_size)
